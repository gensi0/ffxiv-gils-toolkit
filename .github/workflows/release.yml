name: Release

# Pousser un tag vX.Y.Z construit l'image Docker du serveur (API + client web),
# la publie sur GHCR (vX.Y.Z et latest) et crée la release GitHub.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    name: Image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --draft --title "FFXIV Gils Toolkit $TAG" --notes "Image : \`ghcr.io/${GITHUB_REPOSITORY}:${TAG#v}\` (et \`latest\`).

          Mise à jour : \`docker compose pull && docker compose up -d\` (voir deploy/docker-compose.yml)." deploy/docker-compose.yml
