[workspace]
members = [".", "core"]

[package]
name = "ffxiv-trader"
version = "0.6.0"
description = "FFXIV Gils Toolkit : arbitrage et dépense de monnaies à l'hôtel des ventes"
authors = ["g3nsi"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ffxiv_trader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
spender-core = { path = "core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
governor = "0.10.4"
futures = "0.3.34"
tokio-util = "0.7.20"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
bson = { version = "3.1.0", features = ["serde"] }
tauri-plugin-notification = "2.6.0"
flate2 = "1.1.10"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
